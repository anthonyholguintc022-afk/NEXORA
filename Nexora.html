<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>NEXORA — Tu mundo, tus reglas</title>

<style>
  :root {
    color-scheme: dark;
    --bg: #09090b;
    --panel: #131316;
    --panel-2: #1d1d22;
    --text: #f7f7fa;
    --muted: #92929f;
    --line: #ffffff12;
    --accent: #ff244c;
    --accent-soft: #ff244c20;
    --cover: linear-gradient(135deg, #340610, #e72b48 55%, #3a1534);
    --radius: 20px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #050507;
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body.light {
    color-scheme: light;
    --bg: #f4f4f7;
    --panel: #ffffff;
    --panel-2: #eaeaef;
    --text: #17171e;
    --muted: #686874;
    --line: #00000012;
  }

  button, input, textarea { font: inherit; }
  button, a, input, textarea { -webkit-tap-highlight-color: transparent; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  button, a { touch-action: manipulation; }
  button { color: inherit; }
  a { color: inherit; }
  input, textarea { color: var(--text); }
  img { display: block; object-fit: cover; }
  svg { width: 21px; height: 21px; flex-shrink: 0; }
  h1, h2, h3, p { margin: 0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  .app {
    max-width: 480px;
    min-height: 100dvh;
    margin: auto;
    background: var(--bg);
    position: relative;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  .topbar {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }

  .brand {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -1.2px;
  }
  .brand span { color: var(--accent); }
  .brand small {
    display: block;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2px;
    color: var(--muted);
    margin-top: 3px;
  }

  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .tiny { font-size: 11px; }
  .small { font-size: 13px; }
  .accent { color: var(--accent); }
  .pad { padding: 20px; }
  .stack { display: grid; gap: 14px; }

  .icon-btn {
    width: 38px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
  }

  .button {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    border: 0;
    border-radius: 12px;
    padding: 12px 17px;
    background: var(--accent);
    color: white;
    font-size: 13px;
    font-weight: 750;
  }
  .button.secondary {
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
  }
  .button.full { width: 100%; }
  .button.compact { padding: 8px 13px; font-size: 11px; }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--panel-2);
    border: 2px solid var(--bg);
  }

  .verified {
    display: inline-grid;
    place-items: center;
    color: white;
    background: var(--accent);
    width: 13px;
    height: 13px;
    border-radius: 50%;
    font-size: 8px;
    vertical-align: middle;
  }

  main { padding-bottom: 100px; }

  .demo-note {
    padding: 9px 20px;
    background: var(--accent-soft);
    color: var(--muted);
    font-size: 10px;
    text-align: center;
  }

  .tabs {
    display: flex;
    gap: 7px;
    padding: 15px 20px 7px;
  }

  .tab {
    border: 0;
    padding: 8px 15px;
    border-radius: 20px;
    color: var(--muted);
    background: transparent;
    font-size: 12px;
  }
  .tab.active { background: var(--accent); color: white; }

  .stories {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding: 15px 20px 20px;
    scrollbar-width: none;
  }

  .story {
    flex: 0 0 60px;
    display: grid;
    gap: 7px;
    justify-items: center;
    background: none;
    border: 0;
    padding: 0;
    font-size: 10px;
  }

  .story-ring {
    padding: 3px;
    border: 2px solid var(--accent);
    border-radius: 50%;
    position: relative;
  }
  .story-ring img { width: 49px; height: 49px; }
  .story-plus {
    position: absolute;
    right: -3px;
    bottom: -3px;
    width: 21px;
    height: 21px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    font-size: 17px;
    border: 2px solid var(--bg);
  }

  .composer {
    margin: 0 16px 20px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .composer-trigger {
    border: 0;
    text-align: left;
    background: none;
    color: var(--muted);
    flex: 1;
    font-size: 12px;
  }

  .post { border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 15px; }
  .post-head { padding: 0 18px 12px; }
  .post-head strong { font-size: 12px; }
  .post-head p { margin-top: 3px; font-size: 10px; color: var(--muted); }

  .post-photo {
    width: 100%;
    max-height: 570px;
    aspect-ratio: 4 / 4.6;
    object-fit: cover;
    background: var(--panel);
  }
  .post-actions { display: flex; gap: 17px; padding: 13px 18px 8px; }
  .action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 0;
    background: none;
    padding: 0;
    color: var(--text);
    font-size: 12px;
  }
  .action.liked { color: var(--accent); }
  .action.liked svg { fill: var(--accent); }
  .post-copy { padding: 0 18px; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
  .post-copy strong { margin-right: 5px; }
  .comment-link {
    margin: 8px 18px 0;
    border: 0;
    background: none;
    padding: 0;
    color: var(--muted);
    font-size: 11px;
  }

  .bottom-nav {
    position: fixed;
    bottom: 0;
    width: min(100%, 480px);
    padding: 10px 8px calc(12px + env(safe-area-inset-bottom));
    display: flex;
    justify-content: space-around;
    background: var(--bg);
    border-top: 1px solid var(--line);
    z-index: 25;
  }

  .nav-item {
    border: 0;
    background: none;
    color: var(--muted);
    display: grid;
    justify-items: center;
    gap: 5px;
    min-width: 56px;
    font-size: 9px;
  }
  .nav-item.active { color: var(--accent); }
  .nav-create {
    border: 0;
    width: 43px;
    height: 43px;
    border-radius: 15px;
    color: white;
    background: var(--accent);
    display: grid;
    place-items: center;
    box-shadow: 0 6px 24px var(--accent-soft);
  }

  .cover {
    height: 190px;
    background: var(--cover);
    position: relative;
    overflow: hidden;
  }
  .cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 30%, var(--bg));
  }
  .cover-title {
    position: absolute;
    top: 24px;
    left: 22px;
    font-size: 11px;
    letter-spacing: 4px;
    color: #ffffffb0;
    z-index: 1;
  }

  .profile-info { padding: 0 22px 20px; position: relative; margin-top: -46px; }
  .profile-avatar {
    width: 86px;
    height: 86px;
    border: 4px solid var(--bg);
    border-radius: 50%;
    outline: 2px solid var(--accent);
    margin-bottom: 14px;
  }
  .profile-info h1 { font-size: 23px; letter-spacing: -.7px; }
  .profile-bio { font-size: 12px; line-height: 1.7; margin-top: 9px; max-width: 300px; }
  .stats { display: flex; gap: 32px; margin: 20px 0; }
  .stat strong { display: block; font-size: 18px; }
  .stat span { font-size: 10px; color: var(--muted); }

  .world-card {
    padding: 16px;
    margin: 0 18px 12px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .world-card h3 { font-size: 13px; margin-bottom: 5px; }
  .world-card p { color: var(--muted); font-size: 11px; line-height: 1.6; }
  .world-icon {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .section-title { font-size: 14px; margin: 22px 20px 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .grid-item { border: 0; background: var(--panel); padding: 0; position: relative; overflow: hidden; }
  .grid-item img { width: 100%; aspect-ratio: 3 / 4; transition: transform .3s; }
  .grid-item:hover img { transform: scale(1.05); }
  .grid-item span {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 30px 8px 10px;
    color: white;
    background: linear-gradient(transparent, #000b);
    text-align: left;
    font-size: 10px;
  }

  .search-box {
    margin: 18px 20px;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  .search-box input { width: 100%; border: 0; background: none; outline: none; font-size: 12px; }
  .person {
    padding: 13px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .person strong { font-size: 12px; }
  .person p { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .chat-head { padding: 18px; border-bottom: 1px solid var(--line); }
  .chat-messages {
    min-height: 310px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 22px 18px;
  }
  .bubble {
    padding: 12px 14px;
    max-width: 82%;
    border-radius: 16px 16px 16px 4px;
    background: var(--panel-2);
    font-size: 12px;
    line-height: 1.6;
    align-self: flex-start;
    overflow-wrap: anywhere;
  }
  .bubble.mine {
    background: var(--accent);
    color: white;
    align-self: flex-end;
    border-radius: 16px 16px 4px 16px;
  }
  .bubble small { display: block; font-size: 8px; opacity: .7; text-align: right; margin-top: 5px; }
  .chat-form { margin: 0 18px; display: flex; gap: 8px; }
  .field {
    width: 100%;
    padding: 13px 14px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: none;
    font-size: 13px;
  }
  textarea.field { resize: vertical; min-height: 105px; }

  .premium-hero { text-align: center; padding: 32px 20px 22px; }
  .crown { font-size: 43px; margin-bottom: 10px; }
  .premium-hero h1 { font-size: 30px; letter-spacing: 2px; }
  .premium-hero h2 { color: var(--accent); font-size: 13px; letter-spacing: 7px; margin: 6px 0 14px; }
  .premium-hero p { font-size: 12px; color: var(--muted); }
  .feature { padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
  .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
  .price {
    padding: 22px 12px;
    border: 1px solid var(--line);
    border-radius: 17px;
    background: var(--panel);
    text-align: center;
  }
  .price.featured { border-color: var(--accent); background: var(--accent-soft); }
  .price strong { display: block; font-size: 29px; margin: 9px 0 3px; }

  .setting { margin-bottom: 23px; }
  .setting h3 { font-size: 13px; margin-bottom: 12px; }
  .swatches { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch {
    width: 33px;
    height: 33px;
    border: 3px solid transparent;
    border-radius: 50%;
    background: var(--swatch);
  }
  .swatch.selected { outline: 2px solid var(--text); outline-offset: 3px; }
  .theme-options { display: flex; gap: 9px; }
  .theme-option {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px;
    font-size: 12px;
  }
  .theme-option.selected { border-color: var(--accent); color: var(--accent); }
  .cover-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cover-option { height: 65px; border-radius: 12px; border: 2px solid var(--line); }
  .cover-option.selected { border-color: var(--text); }

  .reel { position: relative; margin: 12px; border-radius: 20px; overflow: hidden; background: #111; }
  .reel video { width: 100%; display: block; max-height: 65dvh; background: black; }
  .reel-caption { padding: 16px; font-size: 12px; color: white; line-height: 1.7; }

  .empty { padding: 28px 20px; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.7; }

  dialog {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 23px;
    padding: 0;
    width: min(440px, calc(100% - 24px));
    max-height: 86dvh;
  }
  dialog::backdrop { background: #000b; backdrop-filter: blur(7px); }
  .modal-head { padding: 18px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { font-size: 16px; }
  .modal-body { padding: 20px; }
  .modal-body label { display: block; font-size: 12px; margin-bottom: 7px; }
  .preview { width: 100%; max-height: 240px; object-fit: cover; border-radius: 12px; margin-top: 12px; }
  .comment { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
  .comment strong { display: block; color: var(--accent); }
  .story-image { width: 100%; max-height: 60dvh; object-fit: cover; border-radius: 14px; }
  .story-bar { height: 3px; background: var(--accent); border-radius: 4px; margin-bottom: 14px; }

  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: min(420px, 88%);
    padding: 12px 18px;
    border-radius: 13px;
    background: var(--text);
    color: var(--bg);
    font-size: 12px;
    text-align: center;
    z-index: 100;
    box-shadow: 0 12px 40px #0005;
  }
  .toast[hidden] { display: none; }

  @media (min-width: 700px) {
    body {
      background:
        radial-gradient(ellipse at 25% 20%, #3f0a1b55, transparent 45%),
        radial-gradient(ellipse at 80% 80%, #21134166, transparent 45%),
        #050507;
      background-attachment: fixed;
    }
    .app { box-shadow: 0 0 100px #0007; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand" aria-label="NEXORA">
      <span>N</span>EXORA
      <small>TU MUNDO. TUS REGLAS.</small>
    </div>
    <div class="row">
      <button class="icon-btn" data-action="premium" aria-label="Ver Premium" id="premiumButton"></button>
      <button class="icon-btn" data-action="settings" aria-label="Personalizar" id="settingsButton"></button>
    </div>
  </header>

  <main id="main"></main>
  <nav class="bottom-nav" id="nav" aria-label="Navegación principal"></nav>
</div>

<dialog id="modal" aria-labelledby="modalTitle">
  <div class="modal-head row between">
    <h2 id="modalTitle"></h2>
    <button class="icon-btn" data-action="close" aria-label="Cerrar">✕</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
/* NEXORA — Prototipo local. No incorpora servidor ni autenticación. */

const $ = selector => document.querySelector(selector);

const paths = {
  home: '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
  world: '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',
  chat: '<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5a9.5 9.5 0 0 1 19 0Z"/><path d="M7 10h10M7 14h6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  settings: '<path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/>',
  crown: '<path d="m3 6 4 4 5-7 5 7 4-4-2 13H5Z"/><path d="M5 22h14"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  music: '<path d="M9 18V5l12-2v13"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/>',
  star: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/>',
  back: '<path d="m14 5-7 7 7 7"/>'
};

function icon(name) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true">${paths[name] || paths.star}</svg>`;
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}

const photo = (id, width = 900) =>
  `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${width}&q=80`;

const images = {
  alex: photo('photo-1500648767791-00dcc994a43e', 160),
  valeria: photo('photo-1534528741775-53994a69daeb', 160),
  marco: photo('photo-1506794778202-cad84cf45f1d', 160),
  luna: photo('photo-1524504388940-b1c1722653e1', 160),
  city: photo('photo-1519608487953-e999c86e7455'),
  mountain: photo('photo-1464822759023-fed622ff2c3b'),
  concert: photo('photo-1470229722913-7c0e2dbbafd3'),
  sunset: photo('photo-1472120435266-53107fd0c44a'),
  forest: photo('photo-1441974231531-c6227db76b6e'),
  portrait: photo('photo-1534528741775-53994a69daeb')
};

const people = [
  { id: 'valeria', name: 'Valeria', user: '@valeria.art', bio: 'Arte, luz y momentos.', img: images.valeria },
  { id: 'marco', name: 'Marco', user: '@marco.music', bio: 'Mi vida tiene soundtrack.', img: images.marco },
  { id: 'luna', name: 'Luna', user: '@luna.explora', bio: 'Coleccionando atardeceres.', img: images.luna }
];

const backgrounds = [
  'linear-gradient(135deg, #340610, #e72b48 55%, #3a1534)',
  'linear-gradient(135deg, #151038, #8047d9 55%, #e658a5)',
  'linear-gradient(135deg, #062d35, #15958e 55%, #83bda1)'
];

const initialState = {
  profile: {
    name: 'Alex',
    username: '@alex.world',
    bio: 'Un universo propio, lleno de momentos. ✨\nMúsica, fotografía y nuevas conexiones.',
    avatar: images.alex
  },
  accent: '#ff244c',
  theme: 'dark',
  cover: 0,
  following: [],
  messages: [],
  posts: [
    {
      id: 'post1', author: 'valeria',
      text: 'Hay noches que merecen quedarse para siempre. ❤️ #MiMundo',
      image: images.portrait, likes: 1248, liked: false,
      comments: [{ author: 'Luna', text: '¡Qué bonita energía! ✨' }],
      time: 'Hace 15 min'
    },
    {
      id: 'post2', author: 'marco',
      text: 'Donde las palabras terminan, empieza la música. 🎶',
      image: images.concert, likes: 836, liked: false,
      comments: [], time: 'Hace 42 min'
    },
    {
      id: 'post3', author: 'me',
      text: 'Mi mundo no es un lugar. Es todo lo que me hace sentir vivo.',
      image: images.mountain, likes: 342, liked: false,
      comments: [], time: 'Ayer'
    }
  ]
};

const STORAGE_KEY = 'nexora-prototype-v1';
let state = structuredClone(initialState);

try {
  const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  if (stored && Array.isArray(stored.posts)) {
    state = {
      ...state,
      ...stored,
      profile: { ...state.profile, ...stored.profile }
    };
  }

function notify(message) {
  const toast = $('#toast');
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3400);
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch {
    notify('No se pudo guardar: almacenamiento lleno o bloqueado. Los cambios quedan solo en esta sesión.');
    return false;
  }
}

/* Reduce imágenes antes de almacenarlas. */
async function resizeImage(file, maxSize = 1100) {
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
    throw new Error('Elige una imagen JPG, PNG o WebP.');
  }
  if (file.size > 8 * 1024 * 1024) throw new Error('La imagen debe pesar menos de 8 MB.');

  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();

    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.width * scale));
    canvas.height = Math.max(1, Math.round(img.height * scale));

    const context = canvas.getContext('2d');
    context.fillStyle = '#111111';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(img, 0, 0, canvas.width, canvas.height);

    return canvas.toDataURL('image/jpeg', .78);
  } finally {
    URL.revokeObjectURL(url);
  }
}

document.addEventListener('click', async event => {
  const button = event.target.closest('[data-action]');
  if (!button) return;

  const action = button.dataset.action;
  const id = button.dataset.id;

  if (action === 'navigate') go(button.dataset.view);
  if (action === 'settings') go('settings');
  if (action === 'premium') go('premium');
  if (action === 'close') closeModal();
  if (action === 'compose') compose();
  if (action === 'edit') editProfile();

  if (action === 'tab') {
    feedTab = button.dataset.tab;
    render();
  }

  if (action === 'like') {
    const post = state.posts.find(item => item.id === id);
    if (!post) return;
    post.liked = !post.liked;
    save();
    render();

    if ($('#modal').open && $('#modalBody .post')) {
      $('#modalBody').innerHTML = postCard(post);
    }
  }

  if (action === 'comments') openComments(id);

  if (action === 'open-post') {
    const post = state.posts.find(item => item.id === id);
    if (post) openModal('Tu momento', postCard(post));
  }

  if (action === 'follow') {
    state.following = state.following.includes(id)
      ? state.following.filter(item => item !== id)
      : [...state.following, id];
    save();
    $('#peopleResults').innerHTML = renderPeople($('#search')?.value || '');
  }

  if (action === 'story') {
    const person = people.find(item => item.id === id);
    const storyPhotos = { valeria: images.sunset, marco: images.concert, luna: images.mountain };
    openModal(`Historia de ${person.name}`, `
      <div class="story-bar"></div>
      <img class="story-image" src="${storyPhotos[id]}" alt="Historia de ejemplo de ${person.name}">
      <p class="small" style="margin-top:13px">Un pequeño vistazo a mi mundo. ✨</p>
      <p class="tiny muted" style="margin-top:8px">Muestra visual. Las historias reales con caducidad de 24 horas aún no están implementadas.</p>
    `);
  }

  if (action === 'discovery') {
    const item = discover.find(entry => entry.title === button.dataset.title);
    openModal(item.title, `
      <img class="story-image" src="${item.image}" alt="${item.title}">
      <p class="small muted" style="margin-top:14px">Inspiración de ejemplo para la categoría ${item.title.toLowerCase()}.</p>
    `);
  }

  if (action === 'color') {
    state.accent = button.dataset.color;
    render();
  }

  if (action === 'theme') {
    state.theme = button.dataset.theme;
    render();
  }

  if (action === 'cover') {
    state.cover = Number(button.dataset.cover);
    render();
  }

  if (action === 'save-settings') {
    if (save()) {
      go('world');
      notify('Tu mundo tiene un nuevo estilo ✨');
    }
  }

  if (action === 'premium-info') {
    openModal('Premium está en preparación', `
      <div class="stack">
        <p class="small" style="line-height:1.8">Esta pantalla muestra los planes propuestos para NEXORA. Aún no se puede contratar ni pagar.</p>
        <p class="small muted" style="line-height:1.8">La versión real necesitará un sistema seguro de suscripciones, gestión de cancelaciones y verificación del plan desde el servidor.</p>
        <button class="button full" data-action="close">Entendido</button>
      </div>
    `);
  }

  if (action === 'share') {
    const post = state.posts.find(item => item.id === id);
    if (!post) return;
    // Comparte únicamente el texto: todavía no existen enlaces públicos.
    try {
      if (navigator.share) {
        await navigator.share({ title: 'NEXORA', text: post.text });
      } else if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(post.text);
        notify('Texto copiado. Esta publicación no tiene enlace público.');
      } else {
        openModal('Compartir texto', `
          <p class="small muted" style="margin-bottom:12px">Copia este texto. La publicación todavía no tiene enlace público.</p>
          <textarea class="field" readonly aria-label="Texto para compartir">${esc(post.text)}</textarea>
        `);
      }
    } catch (error) {
      if (error.name !== 'AbortError') notify('No fue posible compartir el texto.');
    }
  }
});

document.addEventListener('input', event => {
  if (event.target.id === 'search') {
    const query = event.target.value.trim();
    $('#peopleResults').innerHTML = renderPeople(query);
    $('#discoverResults').innerHTML = renderDiscover(query);
  }
});

document.addEventListener('change', async event => {
  if (event.target.id !== 'postFile') return;
  const file = event.target.files[0];
  if (!file) return;

  const publishButton = $('#publishButton');
  const preview = $('#photoPreview');
  const fileInput = event.target;
  draftImage = '';
  publishButton.disabled = true;
  fileInput.disabled = true;
  preview.textContent = 'Preparando imagen…';

  try {
    const result = await resizeImage(file);
    if (!preview.isConnected) return;
    draftImage = result;
    preview.innerHTML = `<img class="preview" src="${result}" alt="Vista previa de tu foto">`;
  } catch (error) {
    if (preview.isConnected) preview.textContent = error.message || 'No se pudo leer la imagen.';
  } finally {
    publishButton.disabled = false;
    fileInput.disabled = false;
  }
});

document.addEventListener('submit', async event => {
  const form = event.target;
  if (!['postForm', 'commentForm', 'chatForm', 'profileForm'].includes(form.id)) return;
  event.preventDefault();

  const data = new FormData(form);

  if (form.id === 'postForm') {
    const text = String(data.get('text') || '').trim();
    if (!text && !draftImage) {
      form.querySelector('textarea').setCustomValidity('Escribe algo o añade una foto.');
      form.querySelector('textarea').reportValidity();
      form.querySelector('textarea').setCustomValidity('');
      return;
    }

    state.posts.unshift({
      id: `post-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      author: 'me', text, image: draftImage,
      likes: 0, liked: false, comments: [], time: 'Publicación local'
    });

    const saved = save();
    closeModal();
    feedTab = 'all';
    go('home');
    if (saved) notify('Tu publicación ya está en tu mundo ✨');
  }

  if (form.id === 'commentForm') {
    const text = String(data.get('comment') || '').trim();
    if (!text) return;
    const post = state.posts.find(item => item.id === form.dataset.id);
    if (!post) return;
    post.comments.push({ author: state.profile.name, text });
    save();
    render();
    openComments(post.id);
    $('#commentForm input').focus();
  }

  if (form.id === 'chatForm') {
    const text = String(data.get('message') || '').trim();
    if (!text) return;
    state.messages.push({
      text,
      time: new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })
    });
    save();
    render();
    $('#chatForm input').focus();
    $('#chatForm').scrollIntoView({ block: 'center', behavior: 'instant' });
  }

  if (form.id === 'profileForm') {
    const name = String(data.get('name') || '').trim();
    if (!name) {
      $('#profileName').setCustomValidity('Escribe un nombre.');
      $('#profileName').reportValidity();
      $('#profileName').setCustomValidity('');
      return;
    }

    const submitButton = form.querySelector('[type="submit"]');
    submitButton.disabled = true;

    try {
      let newAvatar = state.profile.avatar;
      const file = $('#avatarFile').files[0];
      if (file) newAvatar = await resizeImage(file, 400);
      if (!form.isConnected) return;

      state.profile = {
        ...state.profile,
        name,
        bio: String(data.get('bio') || '').trim(),
        avatar: newAvatar
      };

      const saved = save();
      closeModal();
      go('world');
      if (saved) notify('Perfil actualizado');
    } catch (error) {
      const errorText = document.createElement('p');
      errorText.className = 'small accent';
      errorText.textContent = error.message || 'No se pudo guardar el perfil.';
      form.append(errorText);
    } finally {
      submitButton.disabled = false;
    }
  }
});

$('#premiumButton').innerHTML = icon('crown');
$('#settingsButton').innerHTML = icon('settings');

applyTheme();
render();
</script>
</body>
</html>
